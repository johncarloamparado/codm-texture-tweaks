name: Build Zygisk Module

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-26

jobs:
  build-module:
    name: Build module (arm64-v8a + armeabi-v7a)
    # Pinned: ubuntu-latest starts moving to Ubuntu 26.04 on 2026-10-19, and the
    # NDK / toolchain setup here is known-good on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch build dependencies
        run: |
          curl -fsSL -o zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          git clone --depth 1 https://github.com/LSPosed/LSPlt

      - name: Configure + compile arm64-v8a
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm64 -j"$(nproc)"

      - name: Configure + compile armeabi-v7a (32-bit)
        run: |
          cmake -B build-arm32 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-arm32 -j"$(nproc)"

      - name: Read module version
        id: meta
        run: echo "version=$(sed -n 's/^version=//p' module.prop | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Assemble module package
        run: |
          mkdir -p out/zygisk
          cp module.prop customize.sh out/
          cp -r webroot META-INF out/
          cp build-arm64/libs/libcodm_tex.so out/zygisk/arm64-v8a.so
          cp build-arm32/libs/libcodm_tex.so out/zygisk/armeabi-v7a.so

      - name: Verify package layout
        run: |
          for f in module.prop customize.sh META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script webroot/index.html zygisk/arm64-v8a.so zygisk/armeabi-v7a.so; do
            test -f "out/$f" || { echo "MISSING out/$f"; exit 1; }
          done
          grep -q '^id=' out/module.prop && grep -q '^versionCode=' out/module.prop
          MV="$(sed -n 's/^version=//p' module.prop | tr -d '\r')"
          CV="$(sed -n 's/^#define VERSION "\(.*\)".*/\1/p' main.cpp | head -n 1)"
          UV="$(sed -n 's/.*echo .UI: \(v[0-9.]*\).;.*/\1/p' webroot/index.html | head -n 1)"
          echo "module.prop=$MV main.cpp=$CV webui=$UV"
          [ "$MV" = "$CV" ] || { echo "::error::VERSION in main.cpp ($CV) differs from module.prop ($MV)"; exit 1; }
          [ "$MV" = "$UV" ] || { echo "::error::UI version in webroot/index.html ($UV) differs from module.prop ($MV)"; exit 1; }

      - name: Upload module package
        uses: actions/upload-artifact@v6
        with:
          name: codm-blocky-textures-${{ steps.meta.outputs.version }}
          path: out/
          if-no-files-found: error
          # No retention-days here on purpose: this repo caps artifact retention
          # at 1 day, and asking for more (it was 30) only triggers a warning.
          # Retention now follows the repository setting.
